<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- iPhone Home Screen Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="11 · 02 · 27 ♥" />
  <meta name="theme-color" content="#FFF9FA" id="theme-color-meta" />
  
  <title>11 · 02 · 27 ♥</title>

  <!-- Google Fonts: Cormorant Garamond (Refined Serif) & Plus Jakarta Sans (Clean Minimalist Labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-primary: #FFF9FA;
      --text-primary: #4A353B;
      --text-secondary: #9E7682;
      --accent-glow: #E88D96;
      --card-bg: rgba(255, 255, 255, 0.56);
      --card-border: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 24px 60px -12px rgba(232, 141, 150, 0.22), 0 4px 16px -2px rgba(255, 194, 209, 0.18);
      --pill-bg: rgba(255, 255, 255, 0.82);
    }

    /* Theme 1: Rosewater & Peony (Luminous Blush, Coral-Peach & Fresh Mint) */
    body[data-theme="botanical"] {
      --bg-primary: #FFF9FA;
      --text-primary: #4A353B;
      --text-secondary: #9E7682;
      --accent-glow: #E88D96;
      --card-bg: rgba(255, 255, 255, 0.56);
      --card-border: rgba(255, 255, 255, 0.90);
      --card-shadow: 0 26px 65px -12px rgba(232, 141, 150, 0.24), 0 6px 20px -4px rgba(255, 182, 193, 0.2);
      --pill-bg: rgba(255, 255, 255, 0.84);
    }

    /* Theme 2: Sunset Sorbet Aura (Vibrant Pastel Lilac, Apricot Nectar & Buttercream) */
    body[data-theme="aura"] {
      --bg-primary: #FFFDF9;
      --text-primary: #46374E;
      --text-secondary: #8F759E;
      --accent-glow: #E58C9A;
      --card-bg: rgba(255, 255, 255, 0.44);
      --card-border: rgba(255, 255, 255, 0.82);
      --card-shadow: 0 26px 65px -12px rgba(186, 148, 214, 0.25), 0 6px 20px -4px rgba(255, 185, 160, 0.2);
      --pill-bg: rgba(255, 255, 255, 0.78);
    }

    /* Theme 3: Terracotta & Marigold Silk (Sunlit Peach, Rose-Berry & Marigold Honey) */
    body[data-theme="linen"] {
      --bg-primary: #FFF9F2;
      --text-primary: #523634;
      --text-secondary: #A4716E;
      --accent-glow: #DF828C;
      --card-bg: rgba(255, 252, 249, 0.52);
      --card-border: rgba(255, 255, 255, 0.86);
      --card-shadow: 0 26px 60px -12px rgba(226, 138, 125, 0.24), 0 6px 20px -4px rgba(255, 210, 150, 0.2);
      --pill-bg: rgba(255, 253, 250, 0.84);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1), color 0.9s ease;
      position: fixed;
      inset: 0;
    }

    .font-serif-display {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-feature-settings: "lnum" 1, "tnum" 1;
      font-variant-numeric: tabular-nums;
    }

    /* Safe Area Support for iPhone Notch / Dynamic Island & Home Indicator */
    .safe-layout {
      height: 100dvh;
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      padding-left: max(1.25rem, env(safe-area-inset-left));
      padding-right: max(1.25rem, env(safe-area-inset-right));
    }

    /* Frosted Countdown Card */
    .countdown-card {
      background: var(--card-bg);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--card-shadow);
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .countdown-card.pulse-gentle {
      transform: scale(1.022);
      box-shadow: 0 30px 70px -10px rgba(232, 141, 150, 0.38);
    }

    /* Theme Background Layers */
    .theme-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
    }

    body[data-theme="botanical"] #layer-botanical,
    body[data-theme="aura"] #layer-aura,
    body[data-theme="linen"] #layer-linen {
      opacity: 1;
    }

    /* Ambient Mesh Gradient Animations */
    @keyframes floatAura1 {
      0%, 100% { transform: translate(0%, 0%) scale(1); }
      33% { transform: translate(9%, -7%) scale(1.1); }
      66% { transform: translate(-6%, 8%) scale(0.95); }
    }
    @keyframes floatAura2 {
      0%, 100% { transform: translate(0%, 0%) scale(1); }
      33% { transform: translate(-8%, 9%) scale(1.08); }
      66% { transform: translate(7%, -6%) scale(0.94); }
    }
    @keyframes floatAura3 {
      0%, 100% { transform: translate(0%, 0%) scale(1); }
      50% { transform: translate(6%, 7%) scale(1.12); }
    }

    .aura-blob-1 { animation: floatAura1 14s ease-in-out infinite; }
    .aura-blob-2 { animation: floatAura2 18s ease-in-out infinite; }
    .aura-blob-3 { animation: floatAura3 16s ease-in-out infinite; }

    /* Gentle Sway for Botanical SVG */
    @keyframes gentleBreeze {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      50% { transform: rotate(1.6deg) translateY(-5px); }
    }
    .botanical-sway {
      transform-origin: center center;
      animation: gentleBreeze 10s ease-in-out infinite;
    }
    .botanical-sway-reverse {
      transform-origin: center center;
      animation: gentleBreeze 12s ease-in-out infinite reverse;
    }

    /* Subtle Silk Grain Overlay for Theme 3 */
    .linen-grain {
      background-image: radial-gradient(rgba(215, 130, 120, 0.06) 1px, transparent 0);
      background-size: 16px 16px;
    }

    /* Cute Tactile Button */
    .cute-trigger-btn {
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border);
      box-shadow: 0 12px 28px -6px rgba(232, 141, 150, 0.30), 0 0 0 4px rgba(255, 255, 255, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background 0.5s ease;
    }
    .cute-trigger-btn:active {
      transform: scale(0.88);
    }

    @keyframes heartBeatSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .heart-pulse {
      animation: heartBeatSoft 2.6s ease-in-out infinite;
    }

    /* Whisper Note Floating Pill */
    .whisper-pill {
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 28px -6px rgba(220, 135, 145, 0.22);
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .whisper-hidden {
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      pointer-events: none;
    }
    .whisper-visible {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    /* Subtle Colon Pulse */
    @keyframes softBlink {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.22; }
    }
    .colon-sep {
      animation: softBlink 2.8s ease-in-out infinite;
      color: var(--accent-glow);
    }
  </style>
</head>

      </div>
    </section>

    <!-- 3. BOTTOM: FLOATING WHISPER PILL + SINGLE CUTE SURPRISE BUTTON -->
    <footer class="w-full flex flex-col items-center justify-end gap-3.5 pb-1">
      
      <!-- Whisper-Short Rotating Sweet Note Pill -->
      <div
        id="whisper-pill"
        class="whisper-pill whisper-hidden px-4 py-1.5 rounded-full"
        aria-live="polite"
      >
        <p id="whisper-text" class="font-serif-display italic text-base sm:text-lg tracking-wide">
          forever starts soon ♥
        </p>
      </div>

      <!-- Single Tactile Cute Button -->
      <button
        id="cute-btn"
        type="button"
        class="cute-trigger-btn w-13 h-13 p-3.5 rounded-full flex items-center justify-center focus:outline-none"
        aria-label="Send love"
      >
        <svg
          id="cute-icon"
          class="w-5 h-5 heart-pulse transition-transform duration-300"
          style="color: #E87A88;"
          viewBox="0 0 24 24"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>

    </footer>

  </main>

  <!-- ==========================================
       APPLICATION LOGIC (COUNTDOWN, THEMES, PETALS)
       ========================================== -->
  <script>
    /******************************************************************
     * 1. WEDDING DATE (FEB 11, 2027 IST) & SWEET WHISPERS
     ******************************************************************/
    const WEDDING_DATE_ISO = "2027-02-11T00:00:00+05:30";

    const SWEET_WHISPERS = [
      "can't wait to marry you",
      "my favorite person ♥",
      "11 · 02 · 2027 ✨",
      "forever starts soon",
      "almost Mrs. ♥",
      "you & me, always",
      "so lucky it's you ✨",
      "my whole heart ♥"
    ];

    /******************************************************************
     * 2. LIVE COUNTDOWN TIMER
     ******************************************************************/
    const elDays  = document.getElementById("cd-days");
    const elHours = document.getElementById("cd-hours");
    const elMins  = document.getElementById("cd-mins");
    const elSecs  = document.getElementById("cd-secs");

    const targetTimestamp = new Date(WEDDING_DATE_ISO).getTime();

    function pad2(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = Math.max(0, targetTimestamp - now);

      const days  = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins  = Math.floor((diff / 1000 / 60) % 60);
      const secs  = Math.floor((diff / 1000) % 60);

      elDays.textContent  = days;
      elHours.textContent = pad2(hours);
      elMins.textContent  = pad2(mins);
      elSecs.textContent  = pad2(secs);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    /******************************************************************
     * 3. CUTE SURPRISE BUTTON: WHISPER PILL + LUMINOUS PETAL & HEART BURST
     ******************************************************************/
    const cuteBtn       = document.getElementById("cute-btn");
    const cuteIcon      = document.getElementById("cute-icon");
    const whisperPill   = document.getElementById("whisper-pill");
    const whisperText   = document.getElementById("whisper-text");
    const countdownCard = document.getElementById("countdown-card");
    const canvas        = document.getElementById("petal-canvas");
    const ctx           = canvas.getContext("2d");

    let whisperIndex = -1;
    let whisperTimer = null;
    let particles    = [];
    let animFrameId  = null;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width  = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Luminous, cheerful pastel palette for floating petals & hearts
    const PETAL_COLORS = [
      "#FF8FA3", // Luminous rose pink
      "#FFB3C1", // Peony blush
      "#FFB59E", // Sun-kissed coral peach
      "#CFA8FF", // Pastel lilac-lavender
      "#88DFC6", // Fresh mint-sage
      "#FFE082", // Marigold buttercream sparkle
      "#FF9EAA"  // Sweet strawberry pastel
    ];

    function spawnPetalBurst(originX, originY) {
      const count = 30;
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
        const speed = 3.0 + Math.random() * 5.6;
        const isHeart = Math.random() < 0.48;

        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 1.3,
          vy: Math.sin(angle) * speed - Math.random() * 1.6,
          gravity: 0.062 + Math.random() * 0.035,
          drag: 0.986,
          size: isHeart ? 6.5 + Math.random() * 5.5 : 5.5 + Math.random() * 6,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.065,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.03 + Math.random() * 0.03,
          alpha: 0.98,
          fade: 0.0055 + Math.random() * 0.0045,
          color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
          type: isHeart ? "heart" : "petal"
        });
      }

      if (!animFrameId) {
        animateParticles();
      }
    }

    function drawHeart(ctx, size) {
      const s = size * 0.12;
      ctx.beginPath();
      ctx.moveTo(0, 3 * s);
      ctx.bezierCurveTo(0, 0, -5 * s, 0, -5 * s, 3 * s);
      ctx.bezierCurveTo(-5 * s, 6 * s, 0, 8.5 * s, 0, 11 * s);
      ctx.bezierCurveTo(0, 8.5 * s, 5 * s, 6 * s, 5 * s, 3 * s);
      ctx.bezierCurveTo(5 * s, 0, 0, 0, 0, 3 * s);
      ctx.closePath();
      ctx.fill();
    }

    function drawPetal(ctx, size) {
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.9, size * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.swayPhase += p.swaySpeed;
        p.vx *= p.drag;
        p.vy = p.vy * p.drag + p.gravity;

        p.x += p.vx + Math.sin(p.swayPhase) * 0.45;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;
        p.alpha -= p.fade;

        if (p.alpha <= 0 || p.y > window.innerHeight + 30) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;

        if (p.type === "heart") {
          drawHeart(ctx, p.size);
        } else {
          drawPetal(ctx, p.size);
        }
        ctx.restore();
      }

      if (particles.length > 0) {
        animFrameId = requestAnimationFrame(animateParticles);
      } else {
        animFrameId = null;
      }
    }

    function triggerCuteMoment() {
      // 1. Cycle to the next sweet whisper
      whisperIndex = (whisperIndex + 1) % SWEET_WHISPERS.length;
      whisperText.textContent = SWEET_WHISPERS[whisperIndex];

      // 2. Show the floating whisper pill
      whisperPill.classList.remove("whisper-hidden");
      whisperPill.classList.add("whisper-visible");

      // 3. Gentle pulse on the frosted countdown card & button icon
      countdownCard.classList.add("pulse-gentle");
      cuteIcon.style.transform = "scale(1.32)";
      setTimeout(() => {
        countdownCard.classList.remove("pulse-gentle");
        cuteIcon.style.transform = "scale(1)";
      }, 420);

      // 4. Spawn luminous pastel petals & hearts from the button's exact coordinates
      const rect = cuteBtn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      spawnPetalBurst(originX, originY);

      // 5. Softly fade out the whisper pill after a few seconds
      if (whisperTimer) clearTimeout(whisperTimer);
      whisperTimer = setTimeout(() => {
        whisperPill.classList.remove("whisper-visible");
        whisperPill.classList.add("whisper-hidden");
      }, 3600);
    }

    cuteBtn.addEventListener("click", triggerCuteMoment);
  </script>
</body>
</html>
